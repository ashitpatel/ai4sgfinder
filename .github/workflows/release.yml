name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check dist/ is current
        run: python3 scripts/build.py --check

      - name: Check tag matches VERSION
        run: |
          version="$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          version="$(cat VERSION)"
          awk -v v="$version" '
            $0 ~ "^## " v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $version"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "AI4SG Finder $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/instructions.md \
            dist/taxonomy.md \
            dist/all-in-one.md \
            dist/kickoff.md \
            dist/ai4sg-finder.zip
